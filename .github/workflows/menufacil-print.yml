name: Menu Fácil Print (APK)

# Compila o aplicativo de impressão do totem no próprio GitHub, para não
# depender de ninguém ter o Android Studio instalado, e publica o APK numa
# release.
#
# A release é de propósito: o endereço dela é aberto, sem conta nem login,
# e é por ele que o botão "Baixar" do painel leva o tablet direto ao
# arquivo. Artifact de execução não serve -- exige estar logado no GitHub.
#
# Roda sozinho quando algo em menufacil-print/ muda, e também pelo botão
# "Run workflow" quando você quiser gerar de novo sem mudar nada.

on:
  push:
    paths:
      - "menufacil-print/**"
      - ".github/workflows/menufacil-print.yml"
  workflow_dispatch:

permissions:
  # para criar e atualizar a release com o APK
  contents: write

env:
  # mesma versão de menufacil-print/app/build.gradle.kts e de
  # src/lib/totem-release.ts: é ela que forma o endereço de download
  VERSAO: "0.1.0"

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ferramentas do Android
        uses: android-actions/setup-android@v3

      # O Gradle do runner muda sem avisar, e versão nova demais não roda
      # com este plugin do Android. Travar aqui é o que faz o APK de hoje
      # compilar igual no mês que vem.
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # APK de depuração: assinado com a chave de teste do próprio Android.
      # Instala no tablet liberando "fontes desconhecidas", que é o caminho
      # normal para aplicativo que não passa pela Play Store.
      - name: Compilar
        working-directory: menufacil-print
        run: gradle --no-daemon assembleDebug

      - name: Nomear com a versão
        run: |
          cp menufacil-print/app/build/outputs/apk/debug/app-debug.apk \
             "menufacil-print-${VERSAO}.apk"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: menufacil-print-apk
          path: menufacil-print-*.apk
          if-no-files-found: error

      # Só no main: branch de teste não troca o arquivo que o restaurante baixa.
      - name: Publicar a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="print-v${VERSAO}"
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" "menufacil-print-${VERSAO}.apk" --clobber
          else
            gh release create "$etiqueta" "menufacil-print-${VERSAO}.apk" \
              --title "Menu Fácil Print $VERSAO" \
              --notes "A ponte entre o Menu Fácil e a impressora térmica do tablet. Baixe o .apk no próprio tablet e libere a instalação de fontes desconhecidas."
          fi
