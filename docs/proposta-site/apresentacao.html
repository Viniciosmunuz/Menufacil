<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:2400px;height:1560px;overflow:hidden;font-family:Inter,sans-serif;color:#1d2026;
 background:radial-gradient(60% 70% at 78% 60%,rgba(249,104,11,.16),transparent 70%),radial-gradient(60% 60% at 0% 100%,#e6dbca,transparent 70%),#f6f1ea}
h1{position:absolute;left:90px;top:70px;font-family:"Bricolage Grotesque";font-size:64px;font-weight:800;letter-spacing:-.04em}
h1 span{color:#f9680b}
p{position:absolute;left:92px;top:156px;font-size:26px;font-weight:500;color:#5b6168}
.janela{position:absolute;left:90px;top:250px;width:1640px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 70px 110px -44px rgba(29,32,38,.5),0 0 0 1.5px rgba(29,32,38,.1)}
.barra{height:56px;background:#eceae6;display:flex;align-items:center;gap:10px;padding:0 22px}
.barra i{width:15px;height:15px;border-radius:15px;display:block}
.barra b{margin-left:26px;flex:1;max-width:760px;height:34px;border-radius:17px;background:#fff;font-size:16px;font-weight:500;color:#5b6168;display:flex;align-items:center;padding:0 20px}
.janela .vista{height:1150px;overflow:hidden}
.janela img{width:1640px;display:block}
.fone{position:absolute;right:120px;top:150px;width:520px;padding:7px;border-radius:84px;background:linear-gradient(135deg,#f4f1ec,#b9b4ab 18%,#8d8980 38%,#d9d5cd 52%,#7f7b73 70%,#c9c5bd 86%,#eeebe5);box-shadow:0 80px 110px -40px rgba(29,32,38,.6),0 30px 50px -30px rgba(29,32,38,.35)}
.fone::before,.fone::after{content:"";position:absolute;width:7px;border-radius:4px;background:linear-gradient(180deg,#cfcbc3,#8b877f 50%,#bdbab1)}
.fone::before{left:-5px;top:230px;height:86px;box-shadow:0 112px 0 #a9a59d}
.fone::after{right:-5px;top:290px;height:140px}
.vidro{padding:13px;border-radius:78px;background:#050506}
.tela{position:relative;border-radius:66px;overflow:hidden;height:1056px;background:#fff}
.tela img{width:100%;display:block;margin-top:54px}
.tela .status{position:absolute;inset:0 0 auto;height:54px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:19px;font-weight:600;z-index:2}
.ilha{position:absolute;top:13px;left:50%;width:140px;height:36px;margin-left:-70px;border-radius:20px;background:#000;z-index:3}
.pe{position:absolute;bottom:9px;left:50%;width:170px;height:6px;margin-left:-85px;border-radius:6px;background:rgba(17,19,22,.85);z-index:3}
.tela::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.2),rgba(255,255,255,0) 26%);z-index:4}
</style></head><body>
<h1>Menu <span>Fácil</span> · proposta de site</h1>
<p>Como a página de venda ficaria no computador e no celular.</p>
<div class="janela"><div class="barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>menufacildelivery.com.br</b></div><div class="vista"><img src="site-novo-computador.png"></div></div>
<div class="fone"><div class="vidro"><div class="tela"><div class="status"><span>9:41</span><span>5G ▮</span></div><span class="ilha"></span><img src="site-novo-celular.png"><span class="pe"></span></div></div></div>
</body></html>
