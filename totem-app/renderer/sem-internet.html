<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Menu Fácil Totem</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <!-- A internet caiu no meio do expediente. Em vez da tela de erro do
         navegador, que ninguém sabe o que fazer com ela, o totem avisa em
         português e tenta voltar sozinho. -->
    <section class="tela centro">
      <h1>Um instante</h1>
      <p class="chamada">Estamos tentando conectar de novo.</p>
      <div class="pulsando"></div>
      <p class="ajuda">Se demorar, chame um atendente.</p>
    </section>
  </body>
</html>
